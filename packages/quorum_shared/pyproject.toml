[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-shared"
version = "0.1.0"
description = "Shared library for the Quorum Discord meeting suite (config, db, providers)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "openai>=1.40",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "icalendar>=5.0",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.2.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quorum_shared*"]
