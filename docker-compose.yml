name: quorum

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quorum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quorum}
      POSTGRES_DB: ${POSTGRES_DB:-quorum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quorum} -d ${POSTGRES_DB:-quorum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler-bot:
    build:
      context: .
      dockerfile: apps/scheduler_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ICAL_PORT:-8080}:8080"   # iCal feed + /healthz
    volumes:
      - ./secrets:/secrets:ro       # optional Google service-account JSON

  scribe-bot:
    build:
      context: .
      dockerfile: apps/scribe_bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/secrets:ro

  # Optional DB inspector: `docker compose --profile dev up adminer`
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
